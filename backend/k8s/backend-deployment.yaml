apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloud-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: cloud-backend

  template:
    metadata:
      labels:
        app: cloud-backend

    spec:
      imagePullSecrets:
        - name: ecr-registry-secret

      containers:
        - name: cloud-backend
          image: 351291606284.dkr.ecr.eu-west-3.amazonaws.com/project-cloud-incident-backend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 3000
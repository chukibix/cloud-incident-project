apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloud-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloud-backend
  template:
    metadata:
      labels:
        app: cloud-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry-secret
      containers:
        - name: cloud-backend
          image: 351291606284.dkr.ecr.eu-west-3.amazonaws.com/project-cloud-incident-backend:2e7fc53
          imagePullPolicy: IfNotPresent
          # REQUIRED FOR HPA: Set baseline CPU requests & limits
          resources:
            requests:
              cpu: "180m"
              memory: "128Mi"
            limits:
              cpu: "220m"
              memory: "256Mi"
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: rds-ca
              mountPath: /etc/rds
              readOnly: true
          env:
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: cloud-db-secret
                  key: DB_HOST
            - name: DB_PORT
              value: "5432"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: cloud-db-secret
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloud-db-secret
                  key: DB_PASSWORD
            - name: DB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: cloud-db-secret
                  key: DB_DATABASE
            - name: DB_SSL_CA
              value: "/etc/rds/ca.crt"
      volumes:
        - name: rds-ca
          secret:
            secretName: cloud-db-ca
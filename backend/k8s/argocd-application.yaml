apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloud-backend
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/chukibix/cloud-incident-project.git
    targetRevision: main
    path: backend/k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
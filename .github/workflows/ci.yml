name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  AWS_REGION: eu-west-3               
  ECR_REPOSITORY: project-cloud-incident-backend

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Extract Short Git SHA
        id: vars
        run: echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Build Image (Keep Local for Scanning)
        uses: docker/build-push-action@v5
        with:
          context: ./backend                 
          load: true 
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }}

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }}
          format: 'table'
          exit-code: '1'           
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Push Verified Image to ECR
        if: success() && github.event_name == 'push'
        run: |
          docker push ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.COMMIT_SHA }}
      
      - name: Update Deployment Manifest
        if: success() && github.event_name == 'push'
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          

          MANIFEST_PATH="backend/k8s/backend-deployment.yaml"
          
          sed -i 's|image: 351291606284.dkr.ecr.eu-west-3.amazonaws.com/project-cloud-incident-backend:.*|image: 351291606284.dkr.ecr.eu-west-3.amazonaws.com/project-cloud-incident-backend:${{ env.COMMIT_SHA }}|g' $MANIFEST_PATH
          
          git add $MANIFEST_PATH
          git commit -m "ci: update backend image tag to ${{ env.COMMIT_SHA }} [skip ci]"
          git push